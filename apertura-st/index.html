<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avorio Botanico — Apertura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:#1a1310;
    overflow:hidden;
    font-family:'Cormorant Garamond',Georgia,serif;
    color:#f3e7dd;
    display:grid;
    place-items:center;
  }

  /* fondo caldo per gli schermi più larghi del video verticale */
  .backdrop{
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse at 50% 42%, #3a2a22 0%, #241a15 46%, #140e0b 100%);
    pointer-events:none;
  }

  /* il video è 9:16: lo mostriamo intero, mai tagliato */
  .frame{
    position:relative;
    /* resta sempre in rapporto 9:16, senza mai essere tagliato */
    width:min(100vw, calc(100vh * 1080 / 1918));
    width:min(100vw, calc(100dvh * 1080 / 1918));
    aspect-ratio:1080/1918;
    overflow:hidden;
    box-shadow:0 0 90px rgba(0,0,0,.55);
  }

  video{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }

  /* il sigillo copre esattamente quello del video e scala con la cornice */
  .seal{
    position:absolute;
    left:50%;top:56%;
    width:67%;
    aspect-ratio:1;
    transform:translate(-50%,-50%);
    opacity:0;
    pointer-events:none;
  }
  /* l'ombra sta sull'svg: le animazioni del contenitore usano filter */
  .seal svg{
    width:100%;height:100%;display:block;overflow:visible;
    filter:drop-shadow(0 9px 16px rgba(92,46,26,.42)) drop-shadow(0 2px 4px rgba(92,46,26,.32));
  }

  /* la ceralacca si schiaccia sulla busta come un timbro vero */
  .seal.impresso{animation:stampa 700ms cubic-bezier(.2,.9,.3,1.2) both}
  @keyframes stampa{
    0%   {opacity:0; transform:translate(-50%,-50%) scale(1.22) rotate(-4deg); filter:blur(4px)}
    60%  {opacity:1; transform:translate(-50%,-50%) scale(.985) rotate(.8deg); filter:blur(0)}
    100% {opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg); filter:blur(0)}
  }

  /* quando la luce esplode, la cera si dissolve e la busta si apre */
  .seal.svanisce{animation:dissolvenza 620ms ease-in both}
  @keyframes dissolvenza{
    0%  {opacity:1; transform:translate(-50%,-50%) scale(1); filter:brightness(1)}
    100%{opacity:0; transform:translate(-50%,-50%) scale(1.12); filter:brightness(1.9) blur(3px)}
  }

  /* riflesso che attraversa la cera una volta impressa */
  .sheen{
    position:absolute;inset:8%;
    border-radius:50%;
    overflow:hidden;
    opacity:0;
    pointer-events:none;
  }
  .sheen::before{
    content:"";
    position:absolute;inset:-20%;
    background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);
    mix-blend-mode:soft-light;
  }
  .seal.impresso .sheen{animation:luccichio 1100ms ease-out 620ms 1 both}
  @keyframes luccichio{
    0%{opacity:0;transform:translateX(-55%)}
    35%{opacity:1}
    100%{opacity:0;transform:translateX(55%)}
  }

  .mono{font-family:'Pinyon Script','Segoe Script','Brush Script MT',cursive}

  /* comandi discreti */
  .controls{
    position:fixed;right:18px;bottom:18px;
    display:flex;gap:10px;z-index:5;
  }
  .controls button{
    width:42px;height:42px;border-radius:50%;
    border:1px solid rgba(243,231,221,.35);
    background:rgba(28,18,12,.45);
    color:#f3e7dd;
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    cursor:pointer;
    display:grid;place-items:center;
    font-size:15px;line-height:1;
    transition:background .25s ease,border-color .25s ease,transform .25s ease;
  }
  .controls button:hover{background:rgba(28,18,12,.7);border-color:rgba(243,231,221,.6);transform:translateY(-2px)}
  .controls button:focus-visible{outline:2px solid #f6e3a8;outline-offset:3px}

  /* schermata di avvio, solo se il browser blocca l'autoplay */
  .tap{
    position:fixed;inset:0;z-index:10;
    display:none;place-items:center;
    background:rgba(18,13,10,.5);
    -webkit-backdrop-filter:blur(3px);
    backdrop-filter:blur(3px);
    border:0;color:inherit;font:inherit;cursor:pointer;
    letter-spacing:.22em;text-transform:uppercase;font-size:13px;
  }
  .tap.show{display:grid}

  @media (prefers-reduced-motion:reduce){
    .seal.impresso{animation:none;opacity:1}
    .seal.svanisce{animation:none;opacity:0}
    .seal.impresso .sheen{animation:none}
  }
</style>
</head>
<body>

<div class="backdrop"></div>

<div class="frame">
  <video id="clip" src="apertura.mp4" autoplay muted loop playsinline preload="auto"></video>

        <radialGradient id="pool" cx="44%" cy="36%" r="72%">

        <linearGradient id="gold" x1="18%" y1="0%" x2="82%" y2="100%">

          <feColorMatrix in="n" type="saturate" values="0" result="g"/>

            <feFuncA type="linear" slope=".10"/>

        <!-- conca interna -->
        <path fill="url(#pool)" filter="url(#incavo)" d="M328.0,200.0 C328.6,207.8 328.4,216.2 326.3,223.6 C324.3,231.1 319.2,237.9 315.6,244.8 C312.0,251.6 308.2,257.9 304.5,264.7 C300.9,271.5 298.3,279.2 293.8,285.5 C289.3,291.9 284.0,298.5 277.7,302.9 C271.3,307.3 263.0,309.2 255.7,311.8 C248.4,314.5 241.1,316.5 233.8,318.8 C226.5,321.1 219.2,323.9 211.6,325.5 C204.0,327.1 195.8,329.0 188.1,328.3 C180.4,327.6 172.6,324.5 165.4,321.5 C158.2,318.5 151.7,314.2 144.9,310.6 C138.1,306.9 131.2,303.9 124.6,299.8 C118.0,295.8 110.9,291.7 105.3,286.3 C99.8,280.9 94.9,274.1 91.5,267.2 C88.1,260.2 87.3,251.9 85.0,244.5 C82.8,237.1 80.0,230.2 78.0,222.8 C75.9,215.4 73.2,207.7 72.5,200.0 C71.8,192.3 71.8,183.9 73.7,176.4 C75.6,168.9 80.3,161.9 83.9,155.0 C87.6,148.2 91.8,142.0 95.6,135.3 C99.3,128.6 102.2,121.3 106.6,114.8 C111.0,108.4 115.8,101.3 122.0,96.7 C128.2,92.0 136.4,89.5 143.8,87.1 C151.2,84.7 159.0,84.2 166.5,82.2 C173.9,80.1 180.8,76.5 188.4,74.7 C196.0,72.8 204.3,70.3 212.0,71.0 C219.6,71.6 227.4,75.5 234.5,78.6 C241.7,81.8 248.0,86.3 254.8,89.9 C261.6,93.5 268.5,96.4 275.3,100.3 C282.0,104.2 289.8,107.7 295.2,113.2 C300.7,118.6 305.0,125.9 308.3,133.0 C311.5,140.0 312.5,148.1 314.9,155.5 C317.2,162.9 320.3,169.7 322.5,177.1 C324.6,184.5 327.3,192.2 328.0,200.0Z"/>

        <!-- bolle e imperfezioni della cera -->

          <circle cx="119" cy="139" r="2.6"/>
          <circle cx="288" cy="268" r="2.1"/>

      </g>

      <!-- monogramma impresso in oro -->
      <g filter="url(#rilievo)">
        <text class="mono" x="155" y="244" text-anchor="middle" font-size="140" fill="url(#gold)">S</text>
        <text class="mono" x="200" y="236" text-anchor="middle" font-size="66"  fill="url(#gold)">&amp;</text>
        <text class="mono" x="248" y="244" text-anchor="middle" font-size="140" fill="url(#gold)">T</text>

    <span class="sheen"></span>
  </div>
</div>

<div class="controls">
  <button id="sound" type="button" aria-label="Attiva l'audio" title="Audio">&#9834;</button>
  <button id="replay" type="button" aria-label="Rivedi l'apertura" title="Rivedi">&#8634;</button>
</div>

<button class="tap" id="tap" type="button">Tocca per aprire</button>

<script>
  var clip   = document.getElementById('clip');
  var seal   = document.getElementById('seal');
  var tap    = document.getElementById('tap');
  var sound  = document.getElementById('sound');
  var replay = document.getElementById('replay');

  // il sigillo è agganciato al video: si imprime all'inizio,
  // svanisce quando la luce esplode e il lembo si solleva
  var IMPRESSIONE = 0.08;   // secondo in cui la ceralacca si posa
  var DISSOLVENZA = 1.45;   // secondo in cui il bagliore la assorbe

  function aggiornaSigillo(){
    var t = clip.currentTime;
    if (t < IMPRESSIONE) {
      if (seal.className !== 'seal') {
        seal.className = 'seal';
        void seal.offsetWidth; // riavvia le animazioni al giro successivo
      }
    } else if (t < DISSOLVENZA) {
      if (!seal.classList.contains('impresso') || seal.classList.contains('svanisce')) {
        seal.className = 'seal impresso';
      }
    } else if (!seal.classList.contains('svanisce')) {
      seal.className = 'seal impresso svanisce';
    }
  }
  clip.addEventListener('timeupdate', aggiornaSigillo);
  clip.addEventListener('seeked', aggiornaSigillo);

  // se il browser blocca l'autoplay, chiediamo un tocco
  var avvio = clip.play();
  if (avvio && avvio.catch) {
    avvio.catch(function(){ tap.classList.add('show'); });
  }
  // se poi parte da solo, l'invito a toccare sparisce
  clip.addEventListener('playing', function(){ tap.classList.remove('show'); });

  tap.addEventListener('click', function(){
    clip.play();
    tap.classList.remove('show');
  });

  sound.addEventListener('click', function(){
    clip.muted = !clip.muted;
    sound.innerHTML = clip.muted ? '&#9834;' : '&#9835;';
    sound.setAttribute('aria-label', clip.muted ? 'Attiva l’audio' : 'Disattiva l’audio');
    if (!clip.muted) clip.play();
  });

  replay.addEventListener('click', function(){
    seal.classList.remove('impresso');
    void seal.offsetWidth;
    clip.currentTime = 0;
    clip.play();
  });
</script>
</body>
</html>
