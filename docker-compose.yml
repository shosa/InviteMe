# InviteMe: tre servizi. Il browser parla solo con "web"; "web" inoltra /api all'API; l'API parla con il database.
name: inviteme

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inviteme
      POSTGRES_USER: inviteme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Imposta POSTGRES_PASSWORD nel file .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inviteme -d inviteme"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://inviteme:${POSTGRES_PASSWORD}@db:5432/inviteme
      APP_URL: ${APP_URL:-http://localhost:3000}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Imposta ADMIN_TOKEN nel file .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SHOPIFY_STORE_DOMAIN: ${SHOPIFY_STORE_DOMAIN:-}
      SHOPIFY_STOREFRONT_TOKEN: ${SHOPIFY_STOREFRONT_TOKEN:-}
      SHOPIFY_VARIANT_ID: ${SHOPIFY_VARIANT_ID:-}
      SHOPIFY_WEBHOOK_SECRET: ${SHOPIFY_WEBHOOK_SECRET:-}
      ALLOW_LOCAL_CHECKOUT: ${ALLOW_LOCAL_CHECKOUT:-false}
      DEMO_MODE: ${DEMO_MODE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - media:/app/data/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      # Solo loopback: ci arriva nginx dell'host (proxy_pass http://127.0.0.1:<WEB_PORT>), non Internet.
      - "127.0.0.1:${WEB_PORT:-8091}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  media:
