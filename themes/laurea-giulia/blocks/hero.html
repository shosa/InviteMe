<section class="sec dip-hero">
  <div class="dip-frame" data-anim="zoomin">
    <p class="dip-kicker">{{t.withJoy}}</p>
    <h1 class="dip-title">{{title}}</h1>
    <span class="dip-seal" aria-hidden="true">{{monogram}}</span>
    {{#hosts}}<p class="dip-hosts">{{hosts}}</p>{{/hosts}}
    {{#occasion}}<p class="dip-occ">{{occasion}}</p>{{/occasion}}
    {{#couplePhoto}}<img class="dip-photo" src="{{couplePhoto}}" alt="">{{/couplePhoto}}
  </div>
</section>
