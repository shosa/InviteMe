<section class="sec gal-hero">
  <div class="gal-letterhead">
    <p class="gal-kicker">{{t.withJoy}}</p>
    <h1 class="gal-title">{{title}}</h1>
  </div>
  <div class="gal-body">
    {{#hosts}}<p class="gal-from">{{hosts}}</p>{{/hosts}}
    {{#occasion}}<p class="gal-occ">{{occasion}}</p>{{/occasion}}
    {{#couplePhoto}}<figure class="gal-photo"><img src="{{couplePhoto}}" alt=""></figure>{{/couplePhoto}}
  </div>
</section>
