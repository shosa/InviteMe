<section class="sec fio-hero">
  <div class="fio-capsule" data-anim="fadeinup">
    <p class="fio-kicker">{{t.withJoy}}</p>
    <h1 class="fio-title">{{title}}</h1>
    {{#hosts}}<p class="fio-hosts">{{hosts}}</p>{{/hosts}}
    {{#occasion}}<p class="fio-occ">{{occasion}}</p>{{/occasion}}
  </div>
  {{#couplePhoto}}<figure class="fio-photo" data-anim="zoomin"><img src="{{couplePhoto}}" alt=""></figure>{{/couplePhoto}}
</section>
