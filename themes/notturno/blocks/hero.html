<section class="sec sip-hero">
  <div class="sip-stage" data-anim="fadein">
    {{#couplePhoto}}<img class="sip-photo" src="{{couplePhoto}}" alt="">{{/couplePhoto}}
    <div class="sip-curtain sip-l" aria-hidden="true"></div>
    <div class="sip-curtain sip-r" aria-hidden="true"></div>
  </div>
  <div class="sip-names" data-anim="fadeinup" style="--d:.2s">
    <p class="sip-kicker">{{t.withJoy}}</p>
    <h1 class="sip-title">{{title}}</h1>
    {{#hosts}}<p class="sip-hosts">{{hosts}}</p>{{/hosts}}
    {{#occasion}}<p class="sip-occ">{{occasion}}</p>{{/occasion}}
  </div>
</section>
