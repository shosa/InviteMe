<section class="sec vel-hero">
  {{#couplePhoto}}<img class="vel-bg" src="{{couplePhoto}}" alt="">{{/couplePhoto}}
  <div class="vel-veil" aria-hidden="true"></div>
  <div class="vel-text" data-anim="fadeinup">
    <p class="vel-kicker">{{t.withJoy}}</p>
    <h1 class="vel-title">{{title}}</h1>
    {{#hosts}}<p class="vel-hosts">{{hosts}}</p>{{/hosts}}
    {{#occasion}}<p class="vel-occ">{{occasion}}</p>{{/occasion}}
  </div>
</section>
