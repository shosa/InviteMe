<section class="sec ed-hero">
  <img class="fl l" src="assets/floral-corner.png" alt="" aria-hidden="true">
  <img class="fl r" src="assets/floral-corner.png" alt="" aria-hidden="true">
  <p class="ed-kicker" data-anim="fadein">{{t.withJoy}}</p>
  <h1 class="ed-masthead" data-anim="fadeinup" style="--d:.1s">{{title}}</h1>
  <div class="ed-issue" data-anim="fadein" style="--d:.25s"><span>{{date.month}} {{date.year}}</span><span>{{date.day}}</span></div>
  {{#hosts}}<p class="ed-hosts" data-anim="fadeinup" style="--d:.3s">{{hosts}}</p>{{/hosts}}
  <img class="orn" src="assets/ornament.svg" alt="" aria-hidden="true" data-anim="fadein" style="--d:.35s">
  {{#couplePhoto}}<img class="ed-photo" src="{{couplePhoto}}" alt="" data-anim="fadein" style="--d:.4s">{{/couplePhoto}}
</section>
