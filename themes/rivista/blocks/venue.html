<section class="sec rv-venue">
  {{#heading}}<h2 class="rv-h2">{{heading}}</h2>{{/heading}}
  <div class="rv-venue-grid">
    <div>
      <p class="rv-venue-name">{{venue | lines}}</p>
      {{#address}}<p class="rv-venue-addr">{{address | lines}}</p>{{/address}}
    </div>
    {{#photo}}<figure><img src="{{photo}}" loading="lazy" alt=""></figure>{{/photo}}
  </div>
</section>
