<section class="sec riv-hero">
  <div class="riv-mast" data-anim="fadein">
    <p class="riv-issue">{{t.withJoy}}</p>
    <h1 class="riv-title">{{title}}</h1>
  </div>
  <div class="riv-cover" data-anim="zoomin">
    {{#couplePhoto}}<img src="{{couplePhoto}}" alt="">{{/couplePhoto}}
    <div class="riv-cap">
      {{#hosts}}<p class="riv-hosts">{{hosts}}</p>{{/hosts}}
      {{#occasion}}<p class="riv-occ">{{occasion}}</p>{{/occasion}}
    </div>
  </div>
</section>
