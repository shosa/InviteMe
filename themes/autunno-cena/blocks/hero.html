<section class="sec tov-hero">
  <div class="tov-cloth" data-anim="fadein">
    <p class="tov-kicker">{{t.withJoy}}</p>
    <h1 class="tov-title">{{title}}</h1>
    {{#hosts}}<p class="tov-hosts">{{hosts}}</p>{{/hosts}}
  </div>
  {{#couplePhoto}}<div class="tov-plate" data-anim="zoomin" style="--d:.2s"><img src="{{couplePhoto}}" alt=""></div>{{/couplePhoto}}
  {{#occasion}}<p class="tov-occ" data-anim="fadeinup" style="--d:.3s">{{occasion}}</p>{{/occasion}}
</section>
