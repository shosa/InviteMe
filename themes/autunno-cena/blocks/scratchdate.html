<section class="sec tov-date">
  <h2 class="title" data-anim="fadeinup">{{t.dateTitle}}</h2>
  <div class="tov-row" data-anim="zoomin" style="--d:.15s">
    <div class="scratch" data-scratch><span class="sc-val">{{date.day}}</span></div>
    <div class="scratch" data-scratch><span class="sc-val">{{date.month}}</span></div>
    <div class="scratch" data-scratch><span class="sc-val">{{date.year}}</span></div>
  </div>
  <div class="sc-labels"><span>{{t.dayLabel}}</span><span>{{t.monthLabel}}</span><span>{{t.yearLabel}}</span></div>
  <button class="reveal-all" type="button" data-scratch-all>{{t.revealAll}}</button>
</section>
