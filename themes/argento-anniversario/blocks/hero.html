<section class="sec cz-hero cz-menu">
  <p class="cz-kick" data-anim="fadein">{{t.kickerInvite}}</p>
  <div class="cz-names" data-anim="fadeinup" style="--d:.1s">{{title}}</div>
  {{#hosts}}<p class="cz-hosts" data-anim="fadeinup" style="--d:.25s">{{hosts}}</p>{{/hosts}}
  {{#occasion}}<p class="cz-occ" data-anim="fadeinup" style="--d:.4s">{{occasion}}</p>{{/occasion}}
  {{#couplePhoto}}<div class="cz-arch" data-anim="zoomin" style="--d:.5s"><img src="{{couplePhoto}}" alt=""></div>{{/couplePhoto}}
</section>
