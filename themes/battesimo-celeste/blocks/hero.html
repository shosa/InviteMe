<section class="sec med-hero">
  <div class="med-wrap" data-anim="zoomin">
    {{#couplePhoto}}<img class="med-photo" src="{{couplePhoto}}" alt="">{{/couplePhoto}}
  </div>
  <div class="med-names">
    <p class="med-kicker">{{t.withJoy}}</p>
    <h1 class="med-title">{{title}}</h1>
    {{#hosts}}<p class="med-hosts">{{hosts}}</p>{{/hosts}}
    {{#occasion}}<p class="med-occ">{{occasion}}</p>{{/occasion}}
  </div>
</section>
