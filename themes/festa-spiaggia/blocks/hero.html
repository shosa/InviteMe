<section class="sec ond-hero">
  <div class="ond-wave" data-anim="fadein">
    <p class="ond-kicker">{{t.withJoy}}</p>
    <h1 class="ond-title">{{title}}</h1>
    {{#hosts}}<p class="ond-hosts">{{hosts}}</p>{{/hosts}}
  </div>
  {{#couplePhoto}}<figure class="ond-photo" data-anim="zoomin"><img src="{{couplePhoto}}" alt=""></figure>{{/couplePhoto}}
  {{#occasion}}<p class="ond-occ" data-anim="fadeinup">{{occasion}}</p>{{/occasion}}
</section>
