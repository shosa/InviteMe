<section class="sec min-hero">
  <p class="min-kicker" data-anim="fadein">{{t.withJoy}}</p>
  <h1 class="min-title" data-anim="fadeinup" style="--d:.1s">{{title}}</h1>
  <div class="min-rule" aria-hidden="true"></div>
  {{#hosts}}<p class="min-hosts" data-anim="fadeinup" style="--d:.2s">{{hosts}}</p>{{/hosts}}
  {{#occasion}}<p class="min-occ" data-anim="fadeinup" style="--d:.3s">{{occasion}}</p>{{/occasion}}
  {{#couplePhoto}}<figure class="min-photo" data-anim="fadein" style="--d:.4s"><img src="{{couplePhoto}}" alt=""></figure>{{/couplePhoto}}
</section>
