<section class="sec cz-date">
  <h2 class="title" data-anim="fadeinup">{{t.dateTitle}}</h2>
  <div class="cz-box" data-anim="zoomin" style="--d:.15s">
    <div class="scratch-row">
      <div class="scratch"><span class="sc-val">{{date.day}}</span></div>
      <div class="scratch"><span class="sc-val">{{date.month}}</span></div>
      <div class="scratch"><span class="sc-val">{{date.year}}</span></div>
    </div>
    <div class="sc-labels"><span>{{t.dayLabel}}</span><span>{{t.monthLabel}}</span><span>{{t.yearLabel}}</span></div>
  </div>
</section>
