<section class="sec cfe-hero">
  <p class="cfe-tag" data-anim="zoomin">{{t.withJoy}}</p>
  <h1 class="cfe-title" data-anim="fadeinup" style="--d:.1s">{{title}}</h1>
  {{#hosts}}<p class="cfe-hosts" data-anim="fadeinup" style="--d:.2s">{{hosts}}</p>{{/hosts}}
  {{#couplePhoto}}<figure class="cfe-photo" data-anim="zoomin" style="--d:.3s"><img src="{{couplePhoto}}" alt=""></figure>{{/couplePhoto}}
  {{#occasion}}<p class="cfe-occ" data-anim="fadeinup" style="--d:.4s">{{occasion}}</p>{{/occasion}}
</section>
