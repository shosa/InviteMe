<section class="sec ser-hero">
  <p class="ser-kicker" data-anim="fadein">{{t.withJoy}}</p>
  <h1 class="ser-title" data-anim="fadeinup" style="--d:.1s">{{title}}</h1>
  {{#hosts}}<p class="ser-hosts" data-anim="fadeinup" style="--d:.2s">{{hosts}}</p>{{/hosts}}
  {{#couplePhoto}}<figure class="ser-leaf" data-anim="zoomin" style="--d:.3s"><img src="{{couplePhoto}}" alt=""></figure>{{/couplePhoto}}
  {{#occasion}}<p class="ser-occ" data-anim="fadeinup" style="--d:.4s">{{occasion}}</p>{{/occasion}}
</section>
