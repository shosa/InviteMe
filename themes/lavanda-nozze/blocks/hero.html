<section class="sec cz-hero">
  <div class="cz-frame" data-anim="zoomin">
    {{#couplePhoto}}<img class="cz-photo" src="{{couplePhoto}}" alt="">{{/couplePhoto}}
    <div class="cz-plate">
      <div class="cz-names" data-anim="fadeinup" style="--d:.1s">{{title}}</div>
      {{#hosts}}<div class="cz-hosts" data-anim="fadeinup" style="--d:.25s">{{hosts}}</div>{{/hosts}}
      {{#occasion}}<div class="cz-occ" data-anim="fadeinup" style="--d:.4s">{{occasion}}</div>{{/occasion}}
    </div>
  </div>
</section>
