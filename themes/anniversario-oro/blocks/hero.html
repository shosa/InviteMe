<section class="sec med-hero">
  <div class="med-ribbon" data-anim="fadeinup">
    <p class="med-kicker">{{t.withJoy}}</p>
    <h1 class="med-title">{{title}}</h1>
    {{#hosts}}<p class="med-hosts">{{hosts}}</p>{{/hosts}}
  </div>
  {{#couplePhoto}}<div class="med-medal" data-anim="zoomin"><img src="{{couplePhoto}}" alt=""></div>{{/couplePhoto}}
  {{#occasion}}<p class="med-occ" data-anim="fadeinup">{{occasion}}</p>{{/occasion}}
</section>
