<section class="sec pag-hero">
  <div class="pag-head">
    <p class="pag-kicker">{{t.withJoy}}</p>
    <h1 class="pag-title">{{title}}</h1>
    {{#hosts}}<p class="pag-hosts">{{hosts}}</p>{{/hosts}}
    {{#occasion}}<p class="pag-occ">{{occasion}}</p>{{/occasion}}
  </div>
  {{#couplePhoto}}<figure class="pag-photo" data-anim="fadein"><img src="{{couplePhoto}}" alt=""></figure>{{/couplePhoto}}
</section>
