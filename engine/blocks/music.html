{{#music}}
<audio data-music loop preload="none" src="{{music}}"></audio>
<button class="music-toggle" type="button" data-music-toggle aria-label="{{t.musicToggle}}">
  <svg data-icon="pause" viewBox="0 0 24 24" style="display:block" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
  <svg data-icon="play" viewBox="0 0 24 24" style="display:none" aria-hidden="true"><polygon points="5,3 19,12 5,21"></polygon></svg>
</button>
{{/music}}
