<section class="sec dt-sec">
  <h2 class="title" data-anim="fadeinup">{{t.dateTitle}}</h2>
  <div class="dt-row" data-shape="{{cellShape}}" data-anim="zoomin" style="--d:.15s">
    <div class="dt-col"><div class="dt-cell"><span class="dt-num">{{date.day}}</span></div>{{#showLabels}}<span class="dt-lab">{{t.dayLabel}}</span>{{/showLabels}}</div>
    <div class="dt-col"><div class="dt-cell"><span class="dt-num">{{date.monthShort}}</span></div>{{#showLabels}}<span class="dt-lab">{{t.monthLabel}}</span>{{/showLabels}}</div>
    <div class="dt-col"><div class="dt-cell"><span class="dt-num">{{date.year}}</span></div>{{#showLabels}}<span class="dt-lab">{{t.yearLabel}}</span>{{/showLabels}}</div>
  </div>
</section>
