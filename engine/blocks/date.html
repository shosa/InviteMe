<section class="sec dt-sec">
  <h2 class="title" data-anim="fadeinup">{{t.dateTitle}}</h2>
  <div class="dt-row" data-anim="zoomin" style="--d:.15s">
    <div class="dt-cell"><span class="dt-num">{{date.day}}</span><span class="dt-lab">{{t.dayLabel}}</span></div>
    <div class="dt-cell"><span class="dt-num">{{date.month}}</span><span class="dt-lab">{{t.monthLabel}}</span></div>
    <div class="dt-cell"><span class="dt-num">{{date.year}}</span><span class="dt-lab">{{t.yearLabel}}</span></div>
  </div>
</section>
