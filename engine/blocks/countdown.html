<section class="sec countdown-sec">
  <div class="card">
    <img class="orn" src="assets/ornament.svg" alt="" data-anim="fadein">
    <div data-countdown="{{eventDate}}T{{eventTime}}" aria-label="{{t.countdownAria}}">
      <div class="time-block" data-cd-block="days"><div class="number-wrap"><span class="number" data-cd="days">00</span></div><div class="label">{{t.days}}</div></div>
      <div class="separator sep1">:</div>
      <div class="time-block" data-cd-block="hours"><div class="number-wrap"><span class="number" data-cd="hours">00</span></div><div class="label">{{t.hours}}</div></div>
      <div class="separator sep2">:</div>
      <div class="time-block" data-cd-block="minutes"><div class="number-wrap"><span class="number" data-cd="minutes">00</span></div><div class="label">{{t.minutes}}</div></div>
      <div class="separator sep3">:</div>
      <div class="time-block" data-cd-block="seconds"><div class="number-wrap"><span class="number" data-cd="seconds">00</span></div><div class="label">{{t.seconds}}</div></div>
    </div>
  </div>
</section>
