<section class="sec img-sec">
  <figure class="img-block" style="margin:0;text-align:center">
    {{#photo}}<img src="{{photo}}" loading="lazy" decoding="async" alt="" data-anim="zoomin" style="display:block;width:100%;height:auto;border-radius:6px">{{/photo}}
    {{#caption}}<figcaption data-anim="fadeinup" style="margin-top:10px;font-size:14px;opacity:.75">{{caption | lines}}</figcaption>{{/caption}}
  </figure>
</section>
