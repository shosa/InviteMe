{{#hasItems}}
<section class="sec prog-sec">
  <div class="card">
    <img class="fl prog-fl l" src="assets/floral-sprig.png" alt="" aria-hidden="true">
    <img class="fl prog-fl r" src="assets/floral-sprig.png" alt="" aria-hidden="true">
    {{#heading}}<h2 class="title" data-anim="fadeinup">{{heading}}</h2>{{/heading}}
    <div class="timeline">
      <img class="finial" src="assets/finial.svg" alt="" aria-hidden="true">
      <div class="rail" aria-hidden="true"></div>
      {{#items}}
      <div class="t-row" data-anim="fadeinup">
        <div class="t-dot"></div>
        <div class="t-cell"><div class="t-time">{{time}}</div><div class="t-name">{{label}}</div></div>
      </div>
      {{/items}}
    </div>
  </div>
</section>
{{/hasItems}}
