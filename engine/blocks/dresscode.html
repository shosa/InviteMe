<section class="sec dress-sec">
  <div class="card">
    {{#heading}}<h2 class="title" data-anim="fadeinup">{{heading}}</h2>{{/heading}}
    {{#dress}}<div class="dress" data-anim="fadeinup" style="--d:.15s">{{dress}}</div>{{/dress}}
    <div class="dress-dots" data-anim="fadeinup" style="--d:.2s;display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:12px">{{#colors}}{{#hex}}<span style="display:inline-flex;flex-direction:column;align-items:center;gap:6px;min-width:56px"><span role="img" aria-label="{{name}}" style="display:block;width:26px;height:26px;border-radius:50%;background:{{hex}};box-shadow:0 0 0 1px rgba(0,0,0,.18)"></span>{{#name}}<span style="font-size:12px;letter-spacing:.04em;opacity:.8">{{name}}</span>{{/name}}</span>{{/hex}}{{/colors}}</div>
    <img class="orn" src="assets/ornament.svg" alt="" data-anim="fadein" style="--d:.3s">
  </div>
</section>
